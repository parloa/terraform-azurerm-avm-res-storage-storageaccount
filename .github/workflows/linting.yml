---
name: linting

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linting-${{ github.event.pull_request.head.repo.full_name }}/${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs:
    if: github.event.repository.name != 'terraform-azurerm-avm-template'
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: check docs
        uses: Azure/terraform-azurerm-avm-template/.github/actions/docs-check@4b0117b767ade13fdd9fa8861fc0fced37be996c # main

  terraform:
    if: github.event.repository.name != 'terraform-azurerm-avm-template'
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: lint terraform
        uses: Azure/terraform-azurerm-avm-template/.github/actions/linting@4b0117b767ade13fdd9fa8861fc0fced37be996c # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  avmfix:
    if: github.event.repository.name != 'terraform-azurerm-avm-template'
    name: avmfix
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: avmfix
        uses: Azure/terraform-azurerm-avm-template/.github/actions/avmfix@4b0117b767ade13fdd9fa8861fc0fced37be996c # main

  lintcomplete:
    needs: [docs, terraform, avmfix]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All linting checks passed"
